services:
  ipu:
    image: ipu:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      SITE_URL: "${SITE_URL:-}"
      HOST: 0.0.0.0
      PORT: "3000"
      MAXMIND_CITY_DB: "${MAXMIND_CITY_DB:-assets/GeoLite2-City-2026-06-05.mmdb}"
      MAXMIND_ASN_DB: "${MAXMIND_ASN_DB:-assets/GeoLite2-ASN.mmdb}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      WEBMCP_ORIGIN_TRIAL_TOKEN: "${WEBMCP_ORIGIN_TRIAL_TOKEN:-}"
    volumes:
      - type: bind
        source: ./assets
        target: /app/assets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
